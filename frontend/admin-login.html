<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Voting System</title>
    <link rel="stylesheet" href="css/admin-login.css">
</head>
<body>
    <div class="admin-login-container">
        <div class="login-box">
            <h1>Admin Login</h1>
            <div id="alertBox" class="alert" style="display:none; margin-bottom: 15px; padding: 10px 14px; border-radius: 6px; font-size: 13px;"></div>
            <form id="adminLoginForm" novalidate>
                <div class="form-group">
                    <label for="adminEmail">Email or Admin ID:</label>
                    <input type="text" id="adminEmail" name="email" placeholder="admin@ovs.com" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password:</label>
                    <input type="password" id="adminPassword" name="password" placeholder="Admin@123" required>
                </div>
                <button type="submit" class="btn-login" id="submitBtn">Login</button>
            </form>
            
            <p class="login-link" style="margin-top: 15px;">Back to <a href="index.html">Home</a></p>
        </div>
    </div>
   <script src="js/main.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
