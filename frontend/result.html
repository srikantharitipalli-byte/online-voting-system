<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Results — OVS</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/result.css" />
</head>
<body>

<header class="site-header">
  <nav class="navbar">
    <a href="index.html" class="brand"><span class="brand-mark">OV</span>OVS</a>
    <button class="nav-toggle" aria-label="Toggle menu">☰</button>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="vote.html">Vote</a></li>
      <li><a href="result.html" class="active">Results</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
    <div class="nav-cta" id="nav-auth-area"></div>
  </nav>
</header>

<main class="page-main">
  <div class="container">

    <div class="result-head">
      <div>
        <span class="eyebrow">Live · Auto-refreshing</span>
        <h1>Election results</h1>
      </div>
      <div class="result-meta">
        <div><strong id="totalVotes">—</strong><span>Total votes</span></div>
        <div><strong id="turnoutPct">—</strong><span>Turnout</span></div>
      </div>
    </div>

    <div id="leaderBanner" class="leader-banner" style="display:none;">
      <span class="badge badge-open">Leading</span>
      <div>
        <h3 id="leaderName">—</h3>
        <p id="leaderParty" style="margin:0;">—</p>
      </div>
      <strong id="leaderVotes" class="mono">—</strong>
    </div>

    <div id="resultsList" class="results-list">
      <div class="result-row skeleton" style="height:64px;"></div>
      <div class="result-row skeleton" style="height:64px;"></div>
      <div class="result-row skeleton" style="height:64px;"></div>
    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>Instantly check final counts and candidate statistics once polling concludes.</span>
      <span><span>Secure Digital Voting Experience</span></span>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/result.js"></script>
</body>
</html>
