<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Candidates - Admin Panel</title>
    <link rel="stylesheet" href="css/admin-dashboard.css">
</head>
<body>
    <div class="admin-dashboard">
        <nav class="admin-navbar">
            <div class="navbar-brand">
                <h2>Admin Panel</h2>
            </div>
            <ul class="navbar-menu">
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="manage-users.html">Manage Users</a></li>
                <li><a href="manage-elections.html">Manage Elections</a></li>
                <li><a href="admin-results.html">Results</a></li>
                <li><a href="index.html" class="logout">Logout</a></li>
            </ul>
        </nav>

        <div class="dashboard-content">
            <h1>Manage Candidates</h1>
            
            <div class="manage-header">
                <button class="btn-add" id="addCandidateBtn">Add New Candidate</button>
                <input type="text" id="searchCandidates" placeholder="Search candidates...">
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Candidate ID</th>
                        <th>Name</th>
                        <th>Party &amp; Symbol</th>
                        <th>Election</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="candidatesTableBody">
                    <!-- Candidates will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Candidate Modal -->
    <div id="candidateModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add/Edit Candidate</h2>
                <span class="close" title="Close modal">&times;</span>
            </div>
            <div class="modal-body">
                <form id="candidateForm">
                    <div class="form-group">
                        <label for="candidateName">Full Name:</label>
                        <input type="text" id="candidateName" required>
                    </div>
                    <div class="form-group">
                        <label for="candidateParty">Party/Affiliation:</label>
                        <input type="text" id="candidateParty" required>
                    </div>
                    <div class="form-group">
                        <label for="candidateElection">Election:</label>
                        <select id="candidateElection" required>
                            <option value="">Select Election</option>
                            <!-- Elections will be populated here -->
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="candidateDescription">Description / Bio:</label>
                        <textarea id="candidateDescription" rows="2" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" placeholder="Brief candidate background or manifesto"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="candidatePhoto">Candidate Photo:</label>
                        <input type="file" id="candidatePhoto" name="candidate_photo" accept="image/png, image/jpeg, image/jpg, image/webp">
                        <div id="photoPreviewContainer" style="margin-top: 8px; display: none;">
                            <img id="photoPreviewImg" src="" alt="Candidate Photo Preview" style="max-height: 80px; max-width: 80px; object-fit: cover; border-radius: 50%; border: 2px solid #ddd;">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="partySymbol">Party Symbol:</label>
                        <input type="file" id="partySymbol" name="party_symbol" accept="image/png, image/jpeg, image/jpg, image/webp, image/svg+xml">
                        <div id="symbolPreviewContainer" style="margin-top: 8px; display: none;">
                            <img id="symbolPreviewImg" src="" alt="Party Symbol Preview" style="max-height: 60px; max-width: 60px; object-fit: contain; border-radius: 6px; border: 1px solid #eee; background: #fff; padding: 2px;">
                        </div>
                    </div>
                   
                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" id="cancelCandidateBtn">Cancel</button>
                        <button type="submit" class="btn-submit" id="submitCandidateBtn">Save Candidate</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/manage-candidates.js"></script>
</body>
</html>
